baseURL = "https://4n6post.com"

title        = "4n6 Post - The Posts, The WriteUps, The CTFs, The Enjoyment"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
# Set to true to enable RSS feed generation
enableRSS = true
# Set to true to enable sitemap generation
enableSitemap = true
pagination.pagerSize  = 30

ignoreFiles = ['🥛']

# Enhanced sitemap configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[services]
  [services.googleAnalytics]
    ID = "G-NSQ2K5MBJ7"

ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.tableOfContents]
    startLevel = 2                # Start TOC from h2 (##)
    endLevel = 3                  # End TOC at h3 (###)
    ordered = false               # Use unordered list
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true             # Enable code fences to use custom renderer
    noClasses = false             # Use CSS classes instead of inline styles
    lineNos = false               # Disable built-in line numbers (we handle this ourselves)

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Theme settings
  defaultTheme = "dark"              # Set default theme: "light", "dark", or "auto" (follows system preference)

  homeSubtitle = "The Posts, The WriteUps, The CTFs, The Enjoyment"         # Subtitle for home page
  disableReadOtherPosts = true       # Set disableReadOtherPosts to true in order to hide the links to other posts.
  enableSharingButtons = true        # Enable sharing buttons, if you like
  enableGlobalLanguageMenu = false   # Show a global language switcher in the navigation bar

  # Metadata mostly used in document's head
  description = "Comprehensive cyber security resource covering digital forensics artifacts, CTF writeups, Useful AI tools, Docker containers setups. Expert analysis of Windows artifacts, registry forensics, malware analysis, and hands-on security tutorials for DFIR professionals and enthusiasts."
  keywords = "homepage, artifacts, blog, 4n6, forensics, cyber security, ctf, writeup, nsec, ns3c, nsec, NorthSec, NorthSec, NSec, NS3C, NSec CTF, NS3C CTF, Cyber Security, Cybersecurity, Cyber Security Blog, Cyber Security Writeup, Cyber Security CTF, digital forensics, DFIR, incident response, malware analysis, registry forensics, Windows artifacts, security tools, AI cybersecurity, Docker security, penetration testing"
  images = ["default.webp"]

  # Author information for SEO
  [params.author]
    name = "JonesCKevin"
    email = ""
    url = "https://4n6post.com"

  [params.favicon]
    mask = "#10b981"
    msapplication = "#111827"

[taxonomies]
  category   = "categories"          # Used for categorizing posts
  tag        = "tags"                # Used for tagging posts
[permalinks]
  blog       = "/blog/:slug/"        # blog posts
  tags       = "/tags/:slug/"        # tag pages
  categories = "/categories/:slug/"  # category pages
  home       = "/"                   # home page  

[languages]
  [languages.en]
    title = "4n6Post"
    keywords = ""
    readOtherPosts = "Read other posts"

  [languages.en.params]
    subtitle  = "The Truest of Subtitles with WriteUps, CTFs, and a bunch of Enjoyment"

    [languages.en.params.logo]
      path = "/images/4n6post-logo.svg"
      alt = "4n6Post"
      logoText = "4n6Post"
      logoHomeLink = "/"

  # Create  Header Menu
  # NOTE: menu entries with [menu.main.params].image render as a logo. Consecutive logo
  # entries are stacked vertically in one header slot, at the position given by their
  # weight (Hugo sorts by weight, then by name - not by the order listed here).
  # image must be a root-relative path (/images/foo.png) or a full URL - a bare
  # relative path (images/foo.png) only resolves on the site root.

  [[menu.main]]
    identifier = "stitchee"
    name       = "Stitchee.ca"
    url        = "https://stitchee.ca/"
    weight     = 43
    [menu.main.params]
      image = "/images/stitchee-logo-w.png"

  [[menu.main]]
    identifier = "bb-shuffle"
    name       = "B-B-Shuffle"
    url        = "https://bb-shuffle.4n6post.com/"
    weight     = 42
    [menu.main.params]
      image = "https://bb-shuffle.4n6post.com/shared/img/bb-logo-transparent-w.png"

  [[menu.main]]
    identifier = "ai-tools"
    name       = "AI Hub"
    url        = "/ai-tools/"
    weight     = 30
  [[menu.main]]
    identifier = "artifacts"
    name       = "Artifacts"
    url        = "/artifacts/"
    weight     = 40
#  [[menu.main]]
#    identifier = "smelling-salts"
#    name       = "Smelling Salts"
#    url        = "/smelling-salts"
#    weight     = 70
  [[menu.main]]
    identifier = "posts"
    name       = "CTF Post"
    url        = "/writeups/"
    weight     = 50
  [[menu.main]]
    identifier = "docker"
    name       = "Dockers"
    url        = "/dockers/"
    weight     = 60
